services:
  postgres:
    image: postgres:16-alpine
    container_name: bc-game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-bcgame}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Force md5 password encryption
    command: >
      postgres
      -c password_encryption=md5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcgame}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bc-game-network

  redis:
    image: redis:7-alpine
    container_name: bc-game-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bc-game-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bc-game-network:
    driver: bridge

